[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pensieve"
version = "0.1.0"
description = "Pensieve — Docling ingestion + embedding pipeline for Indian company annual reports and broker research PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Document parsing — standard pipeline only (no VLM extras)
    "docling>=2.0.0",
    # LLM metadata extraction (OpenAI-compatible NVIDIA NIM endpoint)
    # Also used for OpenAI embedding provider path
    "openai>=1.0.0",
    # Env-var management
    "python-dotenv>=1.0.0",
    # Retry / backoff on LLM API calls
    "tenacity>=8.3.0",
    # Pretty table for manifest stdout output
    "tabulate>=0.9.0",
    # Phase 2 — local embedding model (bge-small-en-v1.5) via fastembed (ONNX runtime)
    "fastembed>=0.3.0",
    # Phase 2 — token counting (cl100k_base encoding)
    "tiktoken>=0.7.0",
    # Phase 2 — Qdrant vector store client
    "qdrant-client>=1.9.0",
    # Phase 3 — FastAPI backend server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]
# Install Phase 2 deps without the heavy ML libraries (e.g. in CI for Phase 1-only tests):
# pip install -e ".[phase1-only]"
phase1-only = [
    "docling>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "tabulate>=0.9.0",
]

[project.scripts]
pensieve-ingest = "pensieve.batch_runner:main"
pensieve-embed  = "pensieve.embed_runner:main"
pensieve-api    = "pensieve.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pensieve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
