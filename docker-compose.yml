# docker-compose.yml — Pensieve Phase 2 local development services
# Usage:
#   docker compose up -d        # start Qdrant in the background
#   docker compose down         # stop (data persisted in qdrant_data volume)
#   docker compose down -v      # stop AND wipe all stored vectors

services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: pensieve_qdrant
    ports:
      - "6333:6333"   # HTTP REST + gRPC
      - "6334:6334"   # gRPC (optional, exposed for completeness)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Increase the default response size limit — some table payloads can be large
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "32"
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
